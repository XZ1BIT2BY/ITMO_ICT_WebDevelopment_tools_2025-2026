version: "3.9"

services:

  # ─── База данных ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (брокер Celery) ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Сервис-парсер курсов ЦБ РФ ──────────────────────────────────────────────
  parser:
    build:
      context: ./parser
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  # ─── Основное FastAPI-приложение ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ADMIN: ${DB_ADMIN}
      JWT_SECRET: ${JWT_SECRET}
      PARSER_URL: ${PARSER_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      parser:
        condition: service_started

  # ─── Celery worker (фоновые задачи) ──────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A worker.celery_app:celery_app worker --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      PARSER_URL: ${PARSER_URL}
    depends_on:
      redis:
        condition: service_healthy
      parser:
        condition: service_started

  # ─── Celery beat (периодические задачи) ──────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A worker.celery_app:celery_app beat --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      PARSER_URL: ${PARSER_URL}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
